<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle (matches Gmail avatar circular crop perfectly) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <circle cx="512" cy="512" r="420" fill="url(#centerGlow)"/>

  <!-- Subtle Outer Ring -->
  <circle cx="512" cy="512" r="470" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 12"/>
  <circle cx="512" cy="512" r="440" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Medical Cross Group (Scaled & Centered in safe zone) -->
  <g transform="translate(512, 512) scale(12.5) translate(-24, -24)">
    <!-- Cross Outline Glow -->
    <path d="M18 4h12v14h14v12H30v14H18V30H4V18h14V4z" fill="rgba(99, 102, 241, 0.12)" stroke="url(#crossGrad)" stroke-width="2.6" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M18 4h12v14h14v12H30v14H18V30H4V18h14V4z" fill="rgba(15, 23, 42, 0.4)" stroke="url(#crossGrad)" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- Heartbeat Pulse Line with Glow -->
    <polyline points="6,24 16,24 19,16 22,32 25,12 28,30 31,24 42,24" fill="none" stroke="url(#pulseGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <polyline points="6,24 16,24 19,16 22,32 25,12 28,30 31,24 42,24" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  </g>
</svg>